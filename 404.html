<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">

  <title>Page Not Found</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    * {
      line-height: 1.2;
      margin: 0;
    }

    html {
      color: #888;
      display: table;
      font-family: sans-serif;
      height: 100%;
      text-align: center;
      width: 100%;
    }

    body {
      display: table-cell;
      vertical-align: middle;
      margin: 2em auto;
    }

    h1 {
      color: #555;
      font-size: 2em;
      font-weight: 400;
    }

    p {
      margin: 0 auto;
      width: 280px;
    }

    .btn {
        display: inline-block;
        padding: 1rem 2rem;
        font-size: 0.72rem;
        text-transform: uppercase;
        letter-spacing: 0.15em;
        font-weight: 700;
        border: 1px solid transparent;
        transition: background-color 0.2s ease, color 0.2s ease;
        cursor: pointer;
        text-align: center;
        background: oklch(100% 0 0);
        color: oklch(45% .045 152);
    }

    a {
        color: inherit;
        text-decoration: none;
    }

    @media only screen and (max-width: 280px) {

      body,
      p {
        width: 95%;
      }

      h1 {
        font-size: 1.5em;
        margin: 0 0 0.3em;
      }

    }
  </style>
</head>

<body>
  <h1>Pagina Non Trovata</h1>
  <p>Spiacenti, ma la pagina che stavi cercando di visualizzare non esiste.</p>
  <a href="index.html" class="btn btn-light">Torna alla home</a>
</body>

</html>
<!-- IE needs 512+ bytes: https://docs.microsoft.com/archive/blogs/ieinternals/friendly-http-error-pages -->
